
    <style>
        .machine {
            width: 200px;
            height: 150px;
            margin: 0 auto;
            border: 2px solid #000;
            background-color: #f0f0f0;
            position: relative;
            overflow: hidden;
            font-size: 12px;
        }

        .highlight {
            position: absolute;
            top: 50px;
            width: 100%;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .slot-container {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .slot-item {
            height: 50px;
            line-height: 50px;
            text-align: center;
            font-size: 14px;
            color: white;
            background-color: gray;
            flex: 0 0 auto;
        }

        button {
            margin-top: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .popup-hidden {
            display: none;
        }

    </style>
</head>
<body>

    <br/><br/>
    <div class="machine">
        <div class="highlight"></div>
        <div class="slot-container" id="slotMachine">
            <div class="slot-item">당첨1</div>
            <div class="slot-item">당첨2</div>
            <div class="slot-item">당첨3</div>
            <div class="slot-item">당첨4</div>
            <div class="slot-item">당첨1</div>
            <div class="slot-item">당첨2</div>
            <div class="slot-item">당첨3</div>
            <div class="slot-item">당첨4</div>
        </div>
    </div>
	<div class="couponNumber" style="text-align:center;"></div>
	<button id="startButton">이벤트 추첨</button>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const slotMachine = document.getElementById('slotMachine');
    const startButton = document.getElementById('startButton');
    const textHeight = 50;
    const totalItems = 8;
    let probabilities = [0.49, 0.01, 0.2, 0.3]; // 초기 확률
    const minProbability = 0.01; // 최소 확률 값
    const maxProbability = 0.49; // 최대 확률 값
    const incrementAmount = 0.05; // 재도전 시 확률 변화량

    let position = 0;
    let speed = 2.2;
    let isRunning = false;
    let slowingDown = false;
    let targetPosition = 0;
    const minSpeed = 0.2;
    const slowStartOffset = textHeight * 8;
    let userId = '';
    let remainingTickets = 0;

    // 티켓 수를 couponNumber에 표시하는 함수
    function updateCouponDisplay() {
        const couponNumberElement = document.querySelector('.couponNumber');
        couponNumberElement.textContent = `현재 남은 쿠폰 수: ${remainingTickets}장`;
    }

    // 서버에서 티켓 정보 가져오기
    function checkUserTickets() {
        CAFE24API.getCustomerIDInfo(function(err, res) {
            if (err) {
                console.error('회원 정보 가져오기 오류:', err.name, '-', err.message);
                return;
            } else {
                userId = res.id.member_id;

                axios.post('https://port-0-tick-lzgmwhc4d9883c97.sel4.cloudtype.app/check-tickets', {
                    userId: userId
                })
                .then(response => {
                    const data = response.data;
                    if (data.tickets > 0) {
                        remainingTickets = data.tickets;
                        updateCouponDisplay();
                    } else {
                        remainingTickets = 0;
                        updateCouponDisplay();
                    }
                })
                .catch(error => {
                    console.error('티켓 확인 중 오류:', error.response ? error.response.data : error.message);
                });
            }
        });
    }

    // 티켓 차감 후 룰렛 시작
    function useTicketAndStartSlotMachine() {
        if (remainingTickets > 0 && !isRunning) {
            axios.post('https://port-0-tick-lzgmwhc4d9883c97.sel4.cloudtype.app/use-ticket', {
                userId: userId
            })
            .then(response => {
                remainingTickets--;  // 티켓 1장 차감
                updateCouponDisplay();  // 티켓 차감 후 표시 업데이트

                // 티켓 차감 성공 후 룰렛 시작
                startSlotMachine(); 
            })
            .catch(error => {
                console.error('티켓 사용 중 오류:', error.response ? error.response.data : error.message);
                alert('티켓 사용 중 오류가 발생했습니다.');
            });
        } else if (remainingTickets <= 0) {
            alert('티켓이 부족하여 룰렛을 돌릴 수 없습니다.');
        }
    }

    // 상품 수령하기 클릭 시 남은 티켓 0으로 설정
    function claimPrize(popup) {
        axios.post('https://port-0-tick-lzgmwhc4d9883c97.sel4.cloudtype.app/update-tickets-to-zero', {
            userId: userId
        })
        .then(response => {
            remainingTickets = 0;
            updateCouponDisplay(); // 쿠폰 수 0으로 업데이트
            document.body.removeChild(popup); // 팝업 닫기
        })
        .catch(error => {
            console.error('서버에서 쿠폰 수 0으로 변경 중 오류 발생:', error.response ? error.response.data : error.message);
            alert('서버 오류로 쿠폰을 0으로 설정하지 못했습니다.');
        });
    }

    // 룰렛 애니메이션 시작
    function startSlotMachine() {
        if (!isRunning) {
            isRunning = true;
            slowingDown = false;
            speed = 10;
            position = 0;
            targetPosition = determineStopPosition();
            animate();
            setTimeout(() => {
                slowingDown = true;
            }, 2000);
        }
    }

	function showResultPopup(result) {
		let popup = document.getElementById('result-popup');

		// 기존 팝업이 있으면 재활용 (중복 생성 방지)
		if (popup) {
			popup.style.display = 'block';  // 기존 팝업을 다시 보여줌
			
			// 재도전 버튼 텍스트도 업데이트
			const retryButton = popup.querySelector('button.retry');
			if (retryButton) {
				retryButton.textContent = `재도전 (남은 쿠폰: ${remainingTickets})`;
			}
		} else {
			// 팝업이 없으면 새로 생성
			popup = document.createElement('div');
			popup.id = 'result-popup';
			popup.style.position = 'fixed';
			popup.style.top = '50%';
			popup.style.left = '50%';
			popup.style.transform = 'translate(-50%, -50%)';
			popup.style.backgroundColor = 'white';
			popup.style.padding = '20px';
			popup.style.border = '1px solid black';
			popup.style.textAlign = 'center';

			const resultText = document.createElement('p');
			resultText.textContent = `당첨 결과: ${result}`;
			popup.appendChild(resultText);

			const claimButton = document.createElement('button');
			claimButton.textContent = '해당 상품 수령하기';
			claimButton.onclick = () => {
				claimPrize(popup);
			};
			popup.appendChild(claimButton);

			const retryButton = document.createElement('button');
			retryButton.textContent = `재도전 (남은 쿠폰: ${remainingTickets})`;
			retryButton.style.marginLeft = '10px';
			retryButton.classList.add('retry'); // 재도전 버튼에 클래스 추가
			retryButton.onclick = () => {
				popup.style.display = 'none';  // 팝업 숨기기
                adjustProbabilities();  // 확률 조정
				useTicketAndStartSlotMachine();  // 티켓 차감 후 다시 도전
			};
			popup.appendChild(retryButton);

			document.body.appendChild(popup);  // 팝업을 문서에 추가
		}
	}

    // 확률을 조정하는 함수
    function adjustProbabilities() {
        // 당첨1 확률 감소, 당첨2 확률 증가
        if (probabilities[0] - incrementAmount >= minProbability) {
            probabilities[0] -= incrementAmount;
        }
        if (probabilities[1] + incrementAmount <= maxProbability) {
            probabilities[1] += incrementAmount;
        }
		//당첨확률 테스트에 표시부분
       console.log(`현재 확률: 당첨1: ${probabilities[0].toFixed(2)}, 당첨2: ${probabilities[1].toFixed(2)}, 당첨3: ${probabilities[2].toFixed(2)}, 당첨4: ${probabilities[3].toFixed(2)}`);
    }

    // 확률에 따라 멈출 위치 결정 함수
    function determineStopPosition() {
        const random = Math.random();
        let accumulatedProbability = 0;

        for (let i = 0; i < probabilities.length; i++) {
            accumulatedProbability += probabilities[i];
            if (probabilities[i] > 0 && random < accumulatedProbability) {
                const positions = [];
                for (let j = 0; j < totalItems; j++) {
                    if (slotMachine.children[j].textContent === `당첨${i + 1}`) {
                        positions.push(j * textHeight - textHeight);
                    }
                }
                const closestPosition = positions.find(pos => pos >= position) || positions[0] + textHeight * totalItems / 2;
                return closestPosition;
            }
        }
        return textHeight;
    }

    // 부드럽게 목표 위치에 다가가며 멈추기 위한 애니메이션 조정
    function smoothStopAnimation() {
        const currentAdjustedPosition = (position % (textHeight * totalItems / 2));
        const difference = targetPosition - currentAdjustedPosition;
        const distanceToStop = Math.abs(difference);

        if (distanceToStop < slowStartOffset) {
            speed = Math.max(minSpeed, (distanceToStop / slowStartOffset) * 10);
        }

        if (distanceToStop < 1) {
            position = targetPosition;
            slotMachine.style.transform = `translateY(${-position}px)`;
            isRunning = false;
            slowingDown = false;

            const resultIndex = Math.floor((position + textHeight) / textHeight) % 4;
            showResultPopup(slotMachine.children[resultIndex].textContent);
            return;
        }

        position += Math.sign(difference) * speed;
        slotMachine.style.transform = `translateY(${-position}px)`;

        requestAnimationFrame(smoothStopAnimation);
    }

    // 무한 루프 애니메이션
    function animate() {
        if (slowingDown) {
            smoothStopAnimation();
            return;
        }

        position += speed;

        if (position >= textHeight * totalItems / 2) {
            position -= textHeight * totalItems / 2;
        }

        slotMachine.style.transform = `translateY(${-position}px)`;

        requestAnimationFrame(animate);
    }

    // 버튼 클릭 이벤트
    startButton.addEventListener('click', () => {
        const popup = document.getElementById('result-popup');
        if (!popup) {
            useTicketAndStartSlotMachine();
        }
    });

    window.onload = () => {
        checkUserTickets();
        animate();
    };
</script>


    <br/><br/>
</body>
</html>
